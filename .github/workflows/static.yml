name: Validate and deploy static content

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  quality:
    name: Source checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      # No npm dependencies currently exist; retain lockfile validation.
      # Add a blocking dependency audit when introducing dependencies.

  security:
    name: Targeted SAST and credential scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install pinned scanner in an isolated environment
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install --disable-pip-version-check semgrep==1.183.0
      - name: Prove findings fail the security gate
        run: SEMGREP="$RUNNER_TEMP/semgrep/bin/semgrep" node scripts/security-scan.mjs --self-test
      - name: Scan repository without printing matched credentials
        run: SEMGREP="$RUNNER_TEMP/semgrep/bin/semgrep" node scripts/security-scan.mjs

  bind-validation:
    name: Independent BIND validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install independent zone validator
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bind9-utils
      - run: npm run test:bind

  # Playwright CI is intentionally DISABLED by owner request on 2026-10-30.
  # See docs/engineering/EXCEPTIONS.md (EX-001). No hidden browser installation.
  # Revisit before feature 2: Chromium/Firefox/WebKit, keyboard and responsive flows.
  # Enable the future browser job and add it to deploy.needs together.

  deploy:
    name: Deploy validated public directory
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [quality, security, bind-validation]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
